<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page not found | Ram Balasubrahmanian</title>
<meta name="robots" content="noindex"/>
<style>
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/dm-serif-display-latin.woff2') format('woff2')}
:root{--bg:#000;--bg3:#1D1D1F;--text:#F5F5F7;--muted:#A1A1A6;--gold:#C9A227;--gold-dim:rgba(201,162,39,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.card{max-width:560px;text-align:center}
.code{display:inline-block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);background:var(--gold-dim);border:1px solid rgba(201,162,39,.35);border-radius:999px;padding:6px 14px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:22px 0 14px}
p{color:var(--muted);margin:0 0 28px}
a.btn{display:inline-block;color:#000;background:var(--gold);text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
a.btn:focus-visible,a.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a.link{color:var(--text);text-decoration:underline;text-underline-offset:4px;margin-left:18px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .5s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="code">404 · not found</span>
    <h1>That page has moved on.</h1>
    <p>The link may be out of date. The portfolio, perspectives and the Enterprise Data Platform hub are all one click away.</p>
    <a class="btn" href="/">Back to the portfolio</a>
    <a class="link" href="/perspectives/">Perspectives</a>
  </div>
</main>
</body>
</html>
